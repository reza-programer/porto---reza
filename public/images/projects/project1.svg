<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <rect width="1200" height="800" fill="#0f172a" />
  <!-- App Top Nav -->
  <rect width="1200" height="60" fill="#1e293b" />
  <circle cx="30" cy="30" r="8" fill="#ef4444" />
  <circle cx="55" cy="30" r="8" fill="#f59e0b" />
  <circle cx="80" cy="30" r="8" fill="#10b981" />
  <rect x="200" y="15" width="800" height="30" rx="6" fill="#334155" />
  <text x="600" y="36" font-family="Arial" font-size="13" fill="#94a3b8" text-anchor="middle">https://shop.reza.dev/products</text>
  
  <!-- Hero Banner -->
  <rect x="40" y="90" width="1120" height="240" rx="16" fill="url(#hero-grad)" />
  <defs>
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <text x="80" y="180" font-family="Arial" font-size="36" font-weight="bold" fill="#ffffff">Modern E-Commerce Store</text>
  <text x="80" y="225" font-family="Arial" font-size="18" fill="#93c5fd">Fullstack Next.js 14 + Stripe Payment Gateway</text>

  <!-- Product Grid -->
  <g transform="translate(40, 360)">
    <rect x="0" y="0" width="350" height="380" rx="12" fill="#1e293b" />
    <rect x="20" y="20" width="310" height="200" rx="8" fill="#334155" />
    <text x="20" y="260" font-family="Arial" font-size="20" font-weight="bold" fill="#ffffff">Smart Wireless Headphones</text>
    <text x="20" y="290" font-family="Arial" font-size="22" font-weight="bold" fill="#38bdf8">$299.00</text>
    <rect x="20" y="315" width="140" height="40" rx="8" fill="#2563eb" />
    <text x="90" y="340" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Add to Cart</text>

    <rect x="385" y="0" width="350" height="380" rx="12" fill="#1e293b" />
    <rect x="405" y="20" width="310" height="200" rx="8" fill="#334155" />
    <text x="405" y="260" font-family="Arial" font-size="20" font-weight="bold" fill="#ffffff">Ultra Mechanical Keyboard</text>
    <text x="405" y="290" font-family="Arial" font-size="22" font-weight="bold" fill="#38bdf8">$189.00</text>
    <rect x="405" y="315" width="140" height="40" rx="8" fill="#2563eb" />
    <text x="475" y="340" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Add to Cart</text>

    <rect x="770" y="0" width="350" height="380" rx="12" fill="#1e293b" />
    <rect x="790" y="20" width="310" height="200" rx="8" fill="#334155" />
    <text x="790" y="260" font-family="Arial" font-size="20" font-weight="bold" fill="#ffffff">4K Ergonomic Monitor</text>
    <text x="790" y="290" font-family="Arial" font-size="22" font-weight="bold" fill="#38bdf8">$499.00</text>
    <rect x="790" y="315" width="140" height="40" rx="8" fill="#2563eb" />
    <text x="860" y="340" font-family="Arial" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Add to Cart</text>
  </g>
</svg>
